name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m py_compile app.py incidentcommander/*.py
      - name: Parser value regression
        run: |
          python - <<'PY'
          from incidentcommander.parser import parse_text
          sample = "2026-07-26 02:00:00 INFO [api] request started\n2026-07-26 02:00:01 ERROR [orders] SQLSTATE connection refused database\n2026-07-26 02:00:02 ERROR [orders] database connection refused\n2026-07-26 02:00:03 WARN [api] upstream timeout\n"
          events = parse_text(sample)
          assert len(events) == 4
          assert events[1].level == "ERROR"
          assert events[1].service == "orders"
          PY
      - name: Core regression tests
        run: python -m pytest -q tests/test_core.py
      - name: V2 parser tests
        run: python -m pytest -q tests/test_parser.py
      - name: V2 analysis and correlation tests
        run: python -m pytest -q tests/test_analysis.py
      - name: V2 redaction, history, and report tests
        run: python -m pytest -q tests/test_redaction_history_report.py
      - name: V3 presentation analytics tests
        run: python -m pytest -q tests/test_presentation.py
      - name: Entrypoint syntax test
        run: python -m pytest -q tests/test_app_syntax.py
