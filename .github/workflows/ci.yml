name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -q -r requirements.txt -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m py_compile app.py incidentcommander/*.py
      - name: Parser event count regression
        run: |
          python - <<'PY'
          from incidentcommander.parser import parse_text
          sample = "2026-07-26 02:00:00 INFO [api] request started\n2026-07-26 02:00:01 ERROR [orders] SQLSTATE connection refused database\n2026-07-26 02:00:02 ERROR [orders] database connection refused\n2026-07-26 02:00:03 WARN [api] upstream timeout\n"
          assert len(parse_text(sample)) == 4
          PY
      - name: Parser severity regression
        run: |
          python - <<'PY'
          from incidentcommander.parser import parse_text
          sample = "2026-07-26 02:00:00 INFO [api] request started\n2026-07-26 02:00:01 ERROR [orders] SQLSTATE connection refused database\n"
          assert parse_text(sample)[1].level == "ERROR"
          PY
      - name: Parser service regression
        run: |
          python - <<'PY'
          from incidentcommander.parser import parse_text
          sample = "2026-07-26 02:00:00 INFO [api] request started\n2026-07-26 02:00:01 ERROR [orders] SQLSTATE connection refused database\n"
          assert parse_text(sample)[1].service == "orders"
          PY
      - name: Core regression suite
        run: pytest -q tests/test_core.py
      - name: Parser tests
        run: pytest -q tests/test_parser.py
      - name: Analysis and correlation tests
        run: pytest -q tests/test_analysis.py
      - name: Redaction, history, and report tests
        run: pytest -q tests/test_redaction_history_report.py
      - name: Entrypoint syntax test
        run: pytest -q tests/test_app_syntax.py
